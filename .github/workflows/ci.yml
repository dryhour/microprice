name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install
        run: uv sync --locked --all-extras --group dev
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Type check
        run: uv run mypy
      # Tests marked `data` need data/ and skip themselves on a fresh clone; the fixtures in
      # tests/fixtures cover the same code paths. Week 7 adds golden/leakage/determinism jobs.
      - name: Tests
        run: uv run pytest -q
