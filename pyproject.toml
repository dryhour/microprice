[project]
name = "microprice"
version = "0.1.0"
description = "Does order-flow imbalance predict short-horizon returns after costs? A research and execution framework for market microstructure."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1",
    "numpy>=2.0",
    "pandas>=2.2",
    "polars>=1.10",
    "pyarrow>=17",
    "pyyaml>=6.0",
    "requests>=2.32",
    "sortedcontainers>=2.4",
    "websockets>=13",
]

[project.optional-dependencies]
research = [
    "ipykernel>=6.29",
    "matplotlib>=3.9",
    "nbclient>=0.10",
    "nbconvert>=7.16",
    "nbformat>=5.10",
    "scipy>=1.14",
    "statsmodels>=0.14",
]

[dependency-groups]
dev = [
    "hypothesis>=6.100",
    "mypy>=1.11",
    "pre-commit>=3.8",
    "pytest>=8.3",
    "ruff>=0.6",
    "types-pyyaml",
    "types-requests",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["common", "ingest", "book", "features"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["research/notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "NPY", "RUF"]
ignore = [
    "RUF001",  # ambiguous unicode in strings: the docs use math symbols on purpose
    "RUF002",
    "RUF003",
]

[tool.mypy]
python_version = "3.11"
files = ["common", "ingest", "book", "features"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
no_implicit_optional = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
markers = [
    "data: needs data under data/ (skipped when it is not there)",
    "network: needs network access",
]
